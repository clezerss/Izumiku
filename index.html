<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI — твой умный помощник</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 92vh;
            max-height: 780px;
            background: rgba(18, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            flex-shrink: 0;
            background-image: url('https://i.ibb.co/Mxq2NDCQ/IMG-0130.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .header-info h2 {
            color: #fff;
            font-size: 17px;
            font-weight: 600;
        }

        .header-info p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .badge {
            background: rgba(102, 126, 234, 0.2);
            color: #a8b5ff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(102, 126, 234, 0.15);
        }

        .settings-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .settings-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: rotate(60deg);
        }

        .settings-panel {
            background: rgba(14, 14, 24, 0.95);
            padding: 16px 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
            flex-shrink: 0;
        }

        .settings-panel.open {
            display: block;
        }

        .settings-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
        }

        .settings-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-group label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .settings-group select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .settings-group select option {
            background: #1a1a2e;
        }

        .settings-group input[type="range"] {
            width: 90px;
            accent-color: #667eea;
            background: transparent;
            cursor: pointer;
        }

        .temp-value {
            color: #a8b5ff;
            font-size: 13px;
            font-weight: 600;
            min-width: 28px;
        }

        .btn-clear {
            background: rgba(255, 70, 70, 0.12);
            border: 1px solid rgba(255, 70, 70, 0.15);
            color: #ff6b6b;
            padding: 6px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-left: auto;
        }

        .btn-clear:hover {
            background: rgba(255, 70, 70, 0.25);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px 10px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .message.user .msg-avatar {
            background: #667eea;
        }

        .message.bot .msg-avatar {
            background-image: url('https://i.ibb.co/Mxq2NDCQ/IMG-0130.jpg');
            background-size: cover;
            background-position: center;
        }

        .message .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            color: #e8e8f0;
            word-wrap: break-word;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 6px;
            color: #fff;
        }

        .message.bot .bubble {
            background: rgba(255, 255, 255, 0.06);
            border-bottom-left-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .message .bubble pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 14px;
            border-radius: 10px;
            overflow-x: auto;
            font-size: 13px;
            margin: 6px 0;
            color: #cdd6f4;
        }

        .message .bubble code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .typing {
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            padding: 8px 0;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .input-area {
            display: flex;
            gap: 12px;
            padding: 12px 22px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-area input:focus {
            border-color: rgba(102, 126, 234, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .input-area button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .input-area button:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        .input-area button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .status-bar {
            text-align: center;
            padding: 6px 0 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                padding: 0;
            }
            .header { padding: 14px 16px; }
            .chat-messages { padding: 16px 16px 8px; }
            .input-area { padding: 10px 16px 14px; gap: 8px; }
            .input-area input { font-size: 14px; }
            .settings-panel { padding: 12px 16px; }
            .settings-row { gap: 8px; }
            .settings-group select { min-width: 100px; font-size: 12px; }
            .message .bubble { max-width: 90%; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="chat-container">

    <!-- ШАПКА -->
    <div class="header">
        <div class="header-left">
            <div class="avatar"></div>
            <div class="header-info">
                <h2>AI Помощник</h2>
                <p>⚡ Gemini 2.0 Flash · Без цензуры</p>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <span class="badge" id="counter">1500/1500</span>
            <button class="settings-toggle" onclick="toggleSettings()">⚙️</button>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
            <div class="settings-group">
                <label>🌡️ Температура</label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.9" oninput="document.getElementById('tempVal').textContent=this.value">
                <span class="temp-value" id="tempVal">0.9</span>
            </div>
            <div class="settings-group">
                <label>🧠 Модель</label>
                <select id="modelSelect">
                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    <option value="dolphin-mistral">Dolphin Mistral (б/ц)</option>
                </select>
            </div>
            <button class="btn-clear" onclick="clearChat()">🗑️ Очистить</button>
        </div>
    </div>

    <!-- ЧАТ -->
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="msg-avatar"></div>
            <div class="bubble">Привет! 👋 Я твой AI-помощник. Спрашивай что угодно — я без цензуры!</div>
        </div>
    </div>

    <!-- ВВОД -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Напиши сообщение..." autofocus>
        <button id="sendBtn" onclick="sendMessage()">→</button>
    </div>

    <div class="status-bar" id="statusBar">💡 Осталось 1500 запросов на сегодня</div>
</div>

<script>
    // ════════════════════════════════════
    //  ТВОЙ API-КЛЮЧ GEMINI
    // ════════════════════════════════════
    const API_KEY = "AQ.Ab8RN6LGYx59g4z0GZhQEhdicLFIN5kCNxXIJWgUzIGibMyfZA";

    // ЛИМИТЫ Gemini (бесплатный тариф)
    const DAILY_LIMIT = 1500;  // 1500 запросов в день!
    const STORAGE_KEY = "gemini_usage";

    // ─── СЧЁТЧИК ───
    function getToday() { return new Date().toDateString(); }

    function getUsage() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { date: getToday(), count: 0 };
            const data = JSON.parse(raw);
            if (data.date !== getToday()) return { date: getToday(), count: 0 };
            return data;
        } catch { return { date: getToday(), count: 0 }; }
    }

    function saveUsage(count) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: getToday(), count }));
    }

    function updateCounter() {
        const usage = getUsage();
        const remaining = Math.max(0, DAILY_LIMIT - usage.count);
        document.getElementById("counter").textContent = `${remaining}/${DAILY_LIMIT}`;
        document.getElementById("statusBar").textContent =
            remaining > 0 ? `💡 Осталось ${remaining} запросов на сегодня` :
            `⛔ Лимит на сегодня исчерпан. Завтра будет снова ${DAILY_LIMIT}!`;
        document.getElementById("sendBtn").disabled = remaining <= 0;
    }

    // ─── ОТПРАВКА ───
    async function sendMessage() {
        const input = document.getElementById("userInput");
        const chat = document.getElementById("chatMessages");
        const msg = input.value.trim();
        if (!msg) return;

        const usage = getUsage();
        if (usage.count >= DAILY_LIMIT) {
            alert(`❌ Лимит на сегодня исчерпан (${DAILY_LIMIT} запросов). Завтра снова!`);
            return;
        }

        // Добавляем сообщение пользователя
        chat.innerHTML += `
            <div class="message user">
                <div class="msg-avatar">👤</div>
                <div class="bubble">${escapeHtml(msg)}</div>
            </div>
        `;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;

        // Блокируем кнопку
        document.getElementById("sendBtn").disabled = true;

        // Показываем "печатает..."
        const typingId = Date.now();
        chat.innerHTML += `
            <div class="message bot" id="typing-${typingId}">
                <div class="msg-avatar"></div>
                <div class="bubble"><span class="typing">✍️ печатает...</span></div>
            </div>
        `;
        chat.scrollTop = chat.scrollHeight;

        try {
            const model = document.getElementById("modelSelect").value;
            const temp = parseFloat(document.getElementById("temperature").value);

            let apiUrl, requestBody;

            // ─── GEMINI ───
            if (model.startsWith("gemini")) {
                const geminiModel = model === "gemini-2.0-flash-exp" ? "gemini-2.0-flash-exp" : "gemini-1.5-pro";
                apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${API_KEY}`;
                requestBody = {
                    contents: [{ parts: [{ text: msg }] }],
                    generationConfig: { temperature: temp }
                };
            }
            // ─── DOLPHIN (через OpenRouter) ───
            else {
                apiUrl = "https://openrouter.ai/api/v1/chat/completions";
                requestBody = {
                    model: "cognitivecomputations/dolphin-mistral-24b-venice-edition:free",
                    messages: [{ role: "user", content: msg }],
                    temperature: temp
                };
            }

            const response = await fetch(apiUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    ...(model.startsWith("gemini") ? {} : { "Authorization": `Bearer ${API_KEY}` })
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();

            // Удаляем "печатает..."
            document.getElementById(`typing-${typingId}`)?.remove();

            let reply;
            if (model.startsWith("gemini")) {
                reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "⚠️ Ошибка: пустой ответ";
            } else {
                reply = data.choices?.[0]?.message?.content || "⚠️ Ошибка API";
            }

            // Увеличиваем счётчик
            const newUsage = getUsage();
            newUsage.count += 1;
            saveUsage(newUsage.count);

            chat.innerHTML += `
                <div class="message bot">
                    <div class="msg-avatar"></div>
                    <div class="bubble">${formatReply(reply)}</div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
            updateCounter();

        } catch (e) {
            document.getElementById(`typing-${typingId}`)?.remove();
            chat.innerHTML += `
                <div class="message bot">
                    <div class="msg-avatar"></div>
                    <div class="bubble" style="color:#ff6b6b;">⚠️ Ошибка: ${e.message}</div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;
        } finally {
            document.getElementById("sendBtn").disabled = false;
            input.focus();
        }
    }

    // ─── ВСПОМОГАТЕЛЬНЫЕ ───
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function formatReply(text) {
        return text
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g, '<i>$1</i>')
            .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\n/g, '<br>');
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('open');
    }

    function clearChat() {
        document.getElementById('chatMessages').innerHTML = `
            <div class="message bot">
                <div class="msg-avatar"></div>
                <div class="bubble">🧹 Чат очищен. Задавай новый вопрос!</div>
            </div>
        `;
    }

    // ─── ENTER ───
    document.getElementById("userInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    // ─── ЗАПУСК ───
    updateCounter();
</script>
</body>
</html>
