<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            max-height: 820px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        /* ═══ ШАПКА ═══ */
        .header {
            padding: 14px 20px;
            background: #141414;
            border-bottom: 1px solid #262626;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-image: url('https://i.ibb.co/Mxq2NDCQ/IMG-0130.jpg');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .header-info h2 {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }

        .header-info p {
            font-size: 12px;
            color: #888;
        }

        .badge {
            background: #2a2a3a;
            color: #a8b5ff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #333;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: 0.2s;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #2a2a2a;
            color: #fff;
        }

        /* ═══ НАСТРОЙКИ ═══ */
        .settings {
            background: #121212;
            padding: 12px 20px;
            border-bottom: 1px solid #262626;
            display: none;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 10px 16px;
            align-items: center;
        }

        .settings.open {
            display: flex;
        }

        .settings label {
            font-size: 13px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .settings select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .settings input[type="range"] {
            width: 80px;
            accent-color: #667eea;
            background: transparent;
            cursor: pointer;
        }

        .settings .temp-val {
            color: #a8b5ff;
            font-size: 13px;
            min-width: 24px;
        }

        .btn-clear {
            background: rgba(255, 70, 70, 0.1);
            border: 1px solid #441a1a;
            color: #ff6b6b;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            margin-left: auto;
        }

        .btn-clear:hover {
            background: rgba(255, 70, 70, 0.2);
        }

        /* ═══ ЧАТ ═══ */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 10px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .chat::-webkit-scrollbar {
            width: 4px;
        }
        .chat::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        .msg {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            flex-direction: row-reverse;
        }

        .msg .icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .msg.user .icon {
            background: #667eea;
            color: #fff;
        }

        .msg.bot .icon {
            background-image: url('https://i.ibb.co/Mxq2NDCQ/IMG-0130.jpg');
            background-size: cover;
            background-position: center;
        }

        .msg .bubble {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .msg.user .bubble {
            background: #2a2a3a;
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .msg.bot .bubble {
            background: #141414;
            border: 1px solid #262626;
            border-bottom-left-radius: 6px;
        }

        .msg .bubble pre {
            background: #0d0d0d;
            padding: 8px 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
            margin: 4px 0;
            color: #cdd6f4;
        }

        .msg .bubble code {
            background: #0d0d0d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        .typing {
            color: #555;
            font-size: 14px;
            padding: 6px 0;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        /* ═══ ВВОД ═══ */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 10px 18px 16px;
            border-top: 1px solid #262626;
            background: #141414;
            flex-shrink: 0;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            background: #0d0d0d;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-area input:focus {
            border-color: #444;
        }

        .input-area input::placeholder {
            color: #444;
        }

        .input-area button {
            padding: 12px 20px;
            background: #2a2a3a;
            border: 1px solid #333;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            line-height: 1;
        }

        .input-area button:hover {
            background: #3a3a4a;
        }

        .input-area button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 4px 0 10px;
            font-size: 12px;
            color: #333;
            flex-shrink: 0;
        }

        /* ═══ МОБИЛЬНАЯ АДАПТАЦИЯ ═══ */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .app {
                max-height: 100vh;
                border-radius: 0;
                border: none;
            }
            .header {
                padding: 12px 16px;
            }
            .chat {
                padding: 12px 14px 8px;
            }
            .input-area {
                padding: 8px 14px 14px;
                gap: 8px;
            }
            .input-area input {
                font-size: 16px;
                padding: 10px 14px;
            }
            .msg .bubble {
                max-width: 90%;
                font-size: 15px;
            }
            .settings {
                padding: 10px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ШАПКА -->
        <div class="header">
            <div class="header-left">
                <div class="avatar"></div>
                <div class="header-info">
                    <h2>Deep AI</h2>
                    <p>Gemini 2.0 Flash · 1500/день</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="badge" id="counter">1500</span>
                <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
            </div>
        </div>

        <!-- НАСТРОЙКИ -->
        <div class="settings" id="settingsPanel">
            <label>🌡️ <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.9" oninput="document.getElementById('tempVal').textContent=this.value">
                <span class="temp-val" id="tempVal">0.9</span>
            </label>
            <label>🧠 <select id="modelSelect">
                    <option value="gemini-2.0-flash-exp">Gemini Flash</option>
                    <option value="gemini-1.5-pro">Gemini Pro</option>
                </select>
            </label>
            <button class="btn-clear" onclick="clearChat()">🗑️ Очистить</button>
        </div>

        <!-- ЧАТ -->
        <div class="chat" id="chat">
            <div class="msg bot">
                <div class="icon"></div>
                <div class="bubble">Привет! 👋 Я Deep AI. Спрашивай что угодно.</div>
            </div>
        </div>

        <!-- ВВОД -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Напиши сообщение..." autofocus>
            <button id="sendBtn" onclick="sendMessage()">→</button>
        </div>

        <div class="status" id="status">💡 Осталось 1500 запросов</div>
    </div>

    <script>
        // ════════════════════════════════════
        //  ТВОЙ API-КЛЮЧ GEMINI
        // ════════════════════════════════════
        const API_KEY = "AQ.Ab8RN6LGYx59g4z0GZhQEhdicLFIN5kCNxXIJWgUzIGibMyfZA";

        const DAILY_LIMIT = 1500;
        const STORAGE_KEY = "gemini_usage";

        // ─── СЧЁТЧИК ───
        function getToday() { return new Date().toDateString(); }

        function getUsage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { date: getToday(), count: 0 };
                const data = JSON.parse(raw);
                if (data.date !== getToday()) return { date: getToday(), count: 0 };
                return data;
            } catch { return { date: getToday(), count: 0 }; }
        }

        function saveUsage(count) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: getToday(), count }));
        }

        function updateCounter() {
            const usage = getUsage();
            const remaining = Math.max(0, DAILY_LIMIT - usage.count);
            document.getElementById("counter").textContent = remaining;
            document.getElementById("status").textContent =
                remaining > 0 ? `💡 Осталось ${remaining} запросов на сегодня` :
                `⛔ Лимит исчерпан. Завтра снова ${DAILY_LIMIT}!`;
            document.getElementById("sendBtn").disabled = remaining <= 0;
        }

        // ─── ОТПРАВКА ───
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const chat = document.getElementById("chat");
            const msg = input.value.trim();
            if (!msg) return;

            const usage = getUsage();
            if (usage.count >= DAILY_LIMIT) {
                alert(`❌ Лимит на сегодня (${DAILY_LIMIT}) исчерпан!`);
                return;
            }

            // Сообщение пользователя
            chat.innerHTML += `
                <div class="msg user">
                    <div class="icon">👤</div>
                    <div class="bubble">${escapeHtml(msg)}</div>
                </div>
            `;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            document.getElementById("sendBtn").disabled = true;

            // Печатает...
            const typingId = Date.now();
            chat.innerHTML += `
                <div class="msg bot" id="typing-${typingId}">
                    <div class="icon"></div>
                    <div class="bubble"><span class="typing">✍️ печатает...</span></div>
                </div>
            `;
            chat.scrollTop = chat.scrollHeight;

            try {
                const model = document.getElementById("modelSelect").value;
                const temp = parseFloat(document.getElementById("temperature").value);

                const geminiModel = model === "gemini-2.0-flash-exp" ? "gemini-2.0-flash-exp" : "gemini-1.5-pro";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${API_KEY}`;

                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: msg }] }],
                        generationConfig: { temperature: temp }
                    })
                });

                const data = await response.json();

                // Удаляем "печатает..."
                document.getElementById(`typing-${typingId}`)?.remove();

                let reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!reply) {
                    // Если Gemini вернул ошибку — показываем её
                    const errorMsg = data.error?.message || "Неизвестная ошибка";
                    throw new Error(errorMsg);
                }

                // Увеличиваем счётчик
                const newUsage = getUsage();
                newUsage.count += 1;
                saveUsage(newUsage.count);

                chat.innerHTML += `
                    <div class="msg bot">
                        <div class="icon"></div>
                        <div class="bubble">${formatReply(reply)}</div>
                    </div>
                `;
                chat.scrollTop = chat.scrollHeight;
                updateCounter();

            } catch (e) {
                document.getElementById(`typing-${typingId}`)?.remove();
                chat.innerHTML += `
                    <div class="msg bot">
                        <div class="icon"></div>
                        <div class="bubble" style="color:#ff6b6b;">⚠️ ${e.message}</div>
                    </div>
                `;
                chat.scrollTop = chat.scrollHeight;
            } finally {
                document.getElementById("sendBtn").disabled = false;
                input.focus();
            }
        }

        // ─── ВСПОМОГАТЕЛЬНЫЕ ───
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatReply(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('open');
        }

        function clearChat() {
            document.getElementById('chat').innerHTML = `
                <div class="msg bot">
                    <div class="icon"></div>
                    <div class="bubble">🧹 Чат очищен. Задавай новый вопрос!</div>
                </div>
            `;
        }

        // ─── ENTER ───
        document.getElementById("userInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // ─── ЗАПУСК ───
        updateCounter();
    </script>

</body>
</html>
